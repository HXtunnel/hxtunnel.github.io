<!DOCTYPE html>
<html>
<head>
    <title>HX Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<div id="loading">
    Connecting to server...
</div>

<div id="offline">
    <h1>Server is down</h1>
</div>

<iframe id="site" hidden></iframe>

<script>

const server =
    "https://fedora.tail05913c.ts.net/admin";


async function checkServer() {

    try {

        const response =
            await fetch(server, {
                cache: "no-store"
            });

        if (!response.ok)
            throw new Error();

        document.getElementById(
            "loading"
        ).style.display = "none";

        const iframe =
            document.getElementById("site");

        iframe.src = server;
        iframe.hidden = false;

    }

    catch {

        document.getElementById(
            "loading"
        ).style.display = "none";

        document.getElementById(
            "offline"
        ).style.display = "flex";

    }
}


checkServer();

</script>

</body>
</html>
