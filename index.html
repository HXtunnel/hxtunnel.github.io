
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HX Chat</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<div id="loading">
    Checking server...
</div>

<div id="offline">
    <h1>HX TUNNEL is currently <br> offline</h1>
</div>

<iframe id="site" hidden></iframe>

<script>
const SERVERS = [
    "https://fedora.tail05913c.ts.net/",
    //"https://your-second-server.example.com/"
];

async function tryServer(url) {
    try {
        const response = await fetch(url, {
            method: "GET",
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Server returned " + response.status);
        }

        return true;
    } catch {
        return false;
    }
}

async function findServer() {
    document.getElementById("loading").textContent =
        "Finding available server...";

    for (const server of SERVERS) {
        if (await tryServer(server)) {
            document.getElementById("loading").style.display = "none";
            document.getElementById("offline").style.display = "none";

            const iframe = document.getElementById("site");
            iframe.src = server;
            iframe.hidden = false;

            return true;
        }
    }

    document.getElementById("loading").style.display = "none";
    document.getElementById("offline").style.display = "flex";

    return false;
}

async function checkUntilOnline() {
    const online = await findServer();

    if (!online) {
        setTimeout(checkUntilOnline, 10000);
    }
}

checkUntilOnline();
</script>
</body>
</html>
