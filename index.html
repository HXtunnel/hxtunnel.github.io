
<!DOCTYPE html>
<html>
<head>
    <title>Fedora Server</title>

    <style>
        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: monospace;
        }

        #loading,
        #offline {
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #site {
            width: 100%;
            height: 100vh;
            border: 0;
        }

        #offline {
            display: none;
        }
    </style>
</head>

<body>

<div id="loading">
    Checking server...
</div>

<div id="offline">
    <h1>Website is down</h1>
    <p>Fedora server could not be reached.</p>
</div>

<iframe id="site" hidden></iframe>

<script>
const SERVERS = [
    "https://fedora.tail05913c.ts.net/",
    //"https://your-second-server.example.com/"
];

async function tryServer(url) {
    try {
        const response = await fetch(url, {
            method: "GET",
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Server returned " + response.status);
        }

        return true;
    } catch {
        return false;
    }
}

async function findServer() {
    document.getElementById("loading").textContent =
        "Finding available server...";

    for (const server of SERVERS) {
        if (await tryServer(server)) {
            document.getElementById("loading").style.display = "none";

            const iframe = document.getElementById("site");
            iframe.src = server;
            iframe.hidden = false;

            return;
        }
    }

    document.getElementById("loading").style.display = "none";
    document.getElementById("offline").style.display = "flex";
}

findServer();
</script>
</body>
</html>
